<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Banner</title>
</head>
<body style="margin:0; background:#111; display:flex; flex-direction:column; align-items:center; padding:20px; font-family:sans-serif;">

<canvas id="c" width="2560" height="1440" style="max-width:100%; border:1px solid #333;"></canvas>

<a id="dl" download="TheInnerMan-banner.png"
   style="margin-top:20px; display:inline-block; background:#c9b98a; color:#0d0d0d; padding:14px 28px; text-decoration:none; border-radius:6px; font-weight:bold;">
  Tap here to download banner
</a>

<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');

// Background: deep black with radial amber glow
const grad = ctx.createRadialGradient(1280, 720, 100, 1280, 720, 1500);
grad.addColorStop(0, '#1a1208');
grad.addColorStop(1, '#000000');
ctx.fillStyle = grad;
ctx.fillRect(0, 0, 2560, 1440);

// Subtle border lines (safe zone hint)
ctx.strokeStyle = 'rgba(201,185,138,0.08)';
ctx.lineWidth = 2;
ctx.strokeRect(507, 508, 1546, 423);

// Main title
ctx.fillStyle = '#ffffff';
ctx.font = 'bold 180px Georgia, serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
ctx.fillText('THE INNER MAN', 1280, 660);

// Divider
ctx.strokeStyle = '#c9b98a';
ctx.lineWidth = 3;
ctx.beginPath();
ctx.moveTo(980, 760);
ctx.lineTo(1580, 760);
ctx.stroke();

// Subtitle
ctx.fillStyle = '#c9b98a';
ctx.font = 'italic 60px Georgia, serif';
ctx.fillText('Precept upon precept — the Word of God, daily.', 1280, 830);

// Wire up download
const link = document.getElementById('dl');
link.href = c.toDataURL('image/png');
</script>

</body>
</html>
